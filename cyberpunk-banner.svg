<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Cyberpunk developer dashboard banner">
  <!--
    ==============================================
    EDIT GUIDE (CUSTOMIZE HERE)
    ==============================================
    NAME: ADLANE
    ROLES:
      Game Developer
      Full Stack Developer
      Cybersecurity Enthusiast
    STACK: UNITY C#, C, PYTHON DJANGO, FLUTTER AND LINUX
    STATUS:
      IT in THO Logistics
    MISSION:
      Build amazing software.
      Learn offensive security.
      Create memorable games.
    COLORS:
      BG #09090B
      SECONDARY #111827
      PURPLE #A855F7
      PINK #EC4899
      CYAN #22D3EE
      GREEN #22C55E
      WHITE #F8FAFC
      GRAY #94A3B8
  -->

  <defs>
    <!-- Core gradients -->
    <linearGradient id="gradNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="48%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.7 0;0.7 0;-0.7 0" dur="16s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="gradPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.76"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.36"/>
    </linearGradient>
    <linearGradient id="gradScanline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gradBorderShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.07"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.07"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="radialLeft" cx="20%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="radialRight" cx="82%" cy="54%" r="60%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <!-- Patterns -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#94A3B8" stroke-opacity="0.11" stroke-width="0.8"/>
    </pattern>

    <!-- Filters -->
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="noiseFX" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="9"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.04"/>
      </feComponentTransfer>
    </filter>

    <!-- Layout clips -->
    <clipPath id="leftClip">
      <rect x="0" y="0" width="768" height="640"/>
    </clipPath>
    <clipPath id="rightClip">
      <rect x="768" y="0" width="512" height="640"/>
    </clipPath>
  </defs>

  <!-- Base background -->
  <rect width="1280" height="640" fill="#09090B"/>
  <rect width="1280" height="640" fill="url(#radialLeft)">
    <animate attributeName="opacity" values="0.78;0.94;0.78" dur="18s" repeatCount="indefinite"/>
  </rect>
  <rect width="1280" height="640" fill="url(#radialRight)">
    <animate attributeName="opacity" values="0.66;0.9;0.66" dur="20s" repeatCount="indefinite"/>
  </rect>
  <rect width="1280" height="640" fill="url(#gridPattern)" opacity="0.35"/>

  <!-- Subtle ambient traces -->
  <g fill="none" stroke="#22D3EE" stroke-opacity="0.18" stroke-linecap="round">
    <path d="M48 108 H248 V162 H420" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.08;0.22;0.08" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M58 514 H208 V464 H338 V510 H530" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.08;0.2;0.08" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Left: identity block (clean hierarchy, no clipping) -->
  <g clip-path="url(#leftClip)" font-family="'JetBrains Mono','IBM Plex Mono','Fira Code',monospace">
    <text x="64" y="124" font-size="84" font-weight="700" letter-spacing="4" fill="url(#gradNeon)" filter="url(#glowStrong)">ADLANE</text>
    <rect x="64" y="145" width="286" height="2" fill="url(#gradNeon)" opacity="0.8"/>

    <text x="64" y="192" font-size="33" font-weight="600" fill="#F8FAFC">Game Developer</text>
    <text x="64" y="231" font-size="30" font-weight="500" fill="#DDE7F2">Full Stack Developer</text>
    <text x="64" y="269" font-size="27" font-weight="500" fill="#94A3B8">Cybersecurity Enthusiast</text>
  </g>

  <!-- Left: terminal panel -->
  <g clip-path="url(#leftClip)" font-family="'JetBrains Mono','IBM Plex Mono','Fira Code',monospace">
    <rect x="56" y="284" width="690" height="244" rx="20" fill="url(#gradPanel)" stroke="url(#gradNeon)" stroke-opacity="0.42"/>
    <rect x="56" y="284" width="690" height="36" rx="20" fill="#111827" fill-opacity="0.72"/>
    <circle cx="82" cy="302" r="4.6" fill="#EC4899"/>
    <circle cx="100" cy="302" r="4.6" fill="#A855F7"/>
    <circle cx="118" cy="302" r="4.6" fill="#22D3EE"/>
    <text x="145" y="307" font-size="13" fill="#94A3B8">/opt/profile/console</text>

    <g font-size="17">
      <text x="76" y="348" fill="#22D3EE">&gt; whoami</text>
      <text x="100" y="372" fill="#94A3B8">Adlane / Computer Science Student</text>

      <text x="76" y="404" fill="#22D3EE">&gt; stack</text>
      <text x="100" y="428" fill="#94A3B8">UNITY C#, C, PYTHON DJANGO, FLUTTER AND LINUX</text>

      <text x="76" y="460" fill="#22D3EE">&gt; current_status</text>
      <text x="100" y="484" fill="#94A3B8">IT in THO Logistics</text>
      <text x="76" y="514" fill="#22C55E">&gt; system  STATUS: ONLINE</text>
      <rect x="324" y="502" width="10" height="15" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Left: mission bar -->
  <g font-family="'JetBrains Mono','IBM Plex Mono','Fira Code',monospace">
    <rect x="56" y="540" width="690" height="84" rx="14" fill="#111827" fill-opacity="0.56" stroke="#22D3EE" stroke-opacity="0.25"/>
    <text x="74" y="563" font-size="12" fill="#94A3B8">CURRENT MISSION</text>
    <text x="74" y="586" font-size="16" fill="#F8FAFC">Build amazing software.</text>
    <text x="74" y="606" font-size="16" fill="#D5E7F9">Learn offensive security.</text>
    <text x="380" y="596" font-size="16" fill="#C8D9EA">Create memorable games.</text>
  </g>

  <!-- Right: single strong visual element (cyberpunk motherboard HUD) -->
  <g clip-path="url(#rightClip)">
    <!-- Board frame -->
    <rect x="792" y="62" width="450" height="516" rx="26" fill="#0E1320" fill-opacity="0.42" stroke="#22D3EE" stroke-opacity="0.34"/>
    <rect x="804" y="74" width="426" height="492" rx="20" fill="none" stroke="#A855F7" stroke-opacity="0.22"/>

    <!-- Main core -->
    <g transform="translate(1017 320)">
      <circle r="112" fill="none" stroke="#22D3EE" stroke-opacity="0.32" stroke-width="1.4"/>
      <circle r="82" fill="none" stroke="#A855F7" stroke-opacity="0.34" stroke-width="1.2" stroke-dasharray="3 9">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="34s" repeatCount="indefinite"/>
      </circle>
      <circle r="56" fill="none" stroke="#EC4899" stroke-opacity="0.32" stroke-width="1"/>
      <rect x="-22" y="-22" width="44" height="44" rx="6" fill="#111827" stroke="url(#gradNeon)" stroke-opacity="0.9" filter="url(#glowSoft)">
        <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="5.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="-12" y="-12" width="24" height="24" rx="4" fill="#22D3EE" fill-opacity="0.18" stroke="#22D3EE" stroke-opacity="0.8"/>
    </g>

    <!-- Motherboard traces -->
    <g fill="none" stroke-linecap="round" stroke-width="1.6" filter="url(#glowSoft)">
      <path d="M1017 208 V140 H908 V108" stroke="#22D3EE" stroke-opacity="0.6"/>
      <path d="M1017 208 V150 H1122 V106" stroke="#A855F7" stroke-opacity="0.58"/>
      <path d="M1017 432 V500 H916 V534" stroke="#22D3EE" stroke-opacity="0.58"/>
      <path d="M1017 432 V508 H1124 V538" stroke="#EC4899" stroke-opacity="0.56"/>
      <path d="M905 320 H842 V258 H816" stroke="#22D3EE" stroke-opacity="0.56"/>
      <path d="M1129 320 H1190 V386 H1220" stroke="#A855F7" stroke-opacity="0.56"/>
      <path d="M910 250 H862 V198 H818" stroke="#22D3EE" stroke-opacity="0.4"/>
      <path d="M1123 392 H1170 V452 H1218" stroke="#EC4899" stroke-opacity="0.38"/>
    </g>

    <!-- Trace nodes -->
    <g>
      <circle cx="908" cy="108" r="5.2" fill="#22D3EE" fill-opacity="0.8"/>
      <circle cx="1122" cy="106" r="5.2" fill="#A855F7" fill-opacity="0.75"/>
      <circle cx="916" cy="534" r="5.2" fill="#22D3EE" fill-opacity="0.75"/>
      <circle cx="1124" cy="538" r="5.2" fill="#EC4899" fill-opacity="0.78"/>
      <circle cx="816" cy="258" r="4.8" fill="#22D3EE" fill-opacity="0.72"/>
      <circle cx="1220" cy="386" r="4.8" fill="#A855F7" fill-opacity="0.72"/>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="6.4s" repeatCount="indefinite"/>
    </g>

    <!-- Dashboard labels -->
    <g font-family="'JetBrains Mono','IBM Plex Mono','Fira Code',monospace" font-size="11" fill="#94A3B8" letter-spacing="1">
      <text x="822" y="98">SYSTEM BUS</text>
      <text x="1136" y="98">SECURITY CHANNEL</text>
      <text x="822" y="560">RUNTIME LAYER</text>
      <text x="1092" y="560">AI PIPELINE</text>
      <text x="968" y="152" fill="#C3D8EA">CORE INTERFACE</text>
    </g>

    <!-- Data pulse packets -->
    <g>
      <circle cx="0" cy="0" r="3.2" fill="#22D3EE" filter="url(#glowSoft)">
        <animateMotion dur="8s" repeatCount="indefinite" path="M1017 208 V140 H908 V108"/>
      </circle>
      <circle cx="0" cy="0" r="3.2" fill="#A855F7" filter="url(#glowSoft)">
        <animateMotion dur="9s" repeatCount="indefinite" path="M1017 208 V150 H1122 V106"/>
      </circle>
      <circle cx="0" cy="0" r="3.2" fill="#EC4899" filter="url(#glowSoft)">
        <animateMotion dur="9.5s" repeatCount="indefinite" path="M1017 432 V508 H1124 V538"/>
      </circle>
    </g>
  </g>

  <!-- Global scanline -->
  <rect x="0" y="-120" width="1280" height="120" fill="url(#gradScanline)" opacity="0.3">
    <animate attributeName="y" values="-120;640" dur="11s" repeatCount="indefinite"/>
  </rect>

  <!-- Noise overlay -->
  <rect width="1280" height="640" filter="url(#noiseFX)" opacity="0.35"/>

  <!-- Border shimmer -->
  <rect x="8" y="8" width="1264" height="624" rx="18" fill="none" stroke="url(#gradBorderShimmer)" stroke-width="2" filter="url(#glowSoft)"/>
</svg>
