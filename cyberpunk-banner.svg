<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Adlane developer profile banner">
  <!--
    ==============================================
    EDIT GUIDE
    ==============================================
    NAME: ADLANE
    ROLES: Game Developer / Full Stack Developer / Cybersecurity Enthusiast
    STACK: UNITY C#, C, PYTHON DJANGO, FLUTTER, REACT AND LINUX
    STATUS: IT @ THO Logistics
    MISSION: Build amazing software. / Learn offensive security. / Create memorable games.
    SIGNATURE ELEMENT: isometric 2x2 cube, referencing the cube-state platformer mechanic
    (faceIndex + orientation tracking) — swap this for whatever project you're proudest
    of next; that's the one piece worth keeping personal rather than generic.
  -->

  <defs>
    <linearGradient id="gradNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="48%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.7 0;0.7 0;-0.7 0" dur="16s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="gradPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.76"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.36"/>
    </linearGradient>
    <linearGradient id="gradScanline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gradBorderShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.07"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.07"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="radialLeft" cx="20%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="radialRight" cx="82%" cy="54%" r="60%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gradCubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="gradCubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gradCubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#94A3B8" stroke-opacity="0.09" stroke-width="0.8"/>
    </pattern>

    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="noiseFX" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="9"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.025"/></feComponentTransfer>
    </filter>

    <clipPath id="leftClip"><rect x="0" y="0" width="768" height="640"/></clipPath>
    <clipPath id="rightClip"><rect x="768" y="0" width="512" height="640"/></clipPath>
  </defs>

  <!-- Base background -->
  <rect width="1280" height="640" fill="#09090B"/>
  <rect width="1280" height="640" fill="url(#radialLeft)">
    <animate attributeName="opacity" values="0.78;0.94;0.78" dur="18s" repeatCount="indefinite"/>
  </rect>
  <rect width="1280" height="640" fill="url(#radialRight)">
    <animate attributeName="opacity" values="0.66;0.9;0.66" dur="20s" repeatCount="indefinite"/>
  </rect>
  <rect width="1280" height="640" fill="url(#gridPattern)" opacity="0.3"/>

  <!-- Left: identity block -->
  <g clip-path="url(#leftClip)" font-family="'JetBrains Mono','IBM Plex Mono','Fira Code',monospace">
    <text x="64" y="124" font-size="84" font-weight="700" letter-spacing="4" fill="url(#gradNeon)" filter="url(#glowStrong)">ADLANE</text>
    <rect x="64" y="145" width="286" height="2" fill="url(#gradNeon)" opacity="0.8"/>

    <text x="64" y="192" font-size="33" font-weight="600" fill="#F8FAFC">Game Developer</text>
    <text x="64" y="231" font-size="30" font-weight="500" fill="#DDE7F2">Full Stack Developer</text>
    <text x="64" y="269" font-size="27" font-weight="500" fill="#94A3B8">Cybersecurity Enthusiast</text>
  </g>

  <!-- Left: terminal panel -->
  <g clip-path="url(#leftClip)" font-family="'JetBrains Mono','IBM Plex Mono','Fira Code',monospace">
    <rect x="56" y="284" width="690" height="244" rx="20" fill="url(#gradPanel)" stroke="url(#gradNeon)" stroke-opacity="0.42"/>
    <rect x="56" y="284" width="690" height="36" rx="20" fill="#111827" fill-opacity="0.72"/>
    <circle cx="82" cy="302" r="4.6" fill="#EC4899"/>
    <circle cx="100" cy="302" r="4.6" fill="#A855F7"/>
    <circle cx="118" cy="302" r="4.6" fill="#22D3EE"/>
    <text x="145" y="307" font-size="13" fill="#94A3B8">/opt/profile/console</text>

    <g font-size="17">
      <text x="76" y="348" fill="#22D3EE">&gt; whoami</text>
      <text x="100" y="372" fill="#94A3B8">Adlane / Computer Science Student</text>

      <text x="76" y="404" fill="#22D3EE">&gt; stack</text>
      <text x="100" y="428" fill="#94A3B8">UNITY C#, C, PYTHON DJANGO, FLUTTER, REACT AND LINUX</text>

      <text x="76" y="460" fill="#22D3EE">&gt; current_status</text>
      <text x="100" y="484" fill="#94A3B8">IT @ THO Logistics</text>
      <text x="76" y="514" fill="#22C55E">&gt; system  STATUS: ONLINE</text>
      <rect x="324" y="502" width="10" height="15" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Left: mission bar -->
  <g font-family="'JetBrains Mono','IBM Plex Mono','Fira Code',monospace">
    <rect x="56" y="540" width="690" height="84" rx="14" fill="#111827" fill-opacity="0.56" stroke="#22D3EE" stroke-opacity="0.25"/>
    <text x="74" y="563" font-size="12" fill="#94A3B8">CURRENT MISSION</text>
    <text x="74" y="586" font-size="16" fill="#F8FAFC">Build amazing software.</text>
    <text x="74" y="606" font-size="16" fill="#D5E7F9">Learn offensive security.</text>
    <text x="380" y="596" font-size="16" fill="#C8D9EA">Create memorable games.</text>
  </g>

  <!-- Right: signature element — isometric cube (nods to the cube-state platformer mechanic) -->
  <g clip-path="url(#rightClip)">
    <rect x="792" y="62" width="450" height="516" rx="26" fill="#0E1320" fill-opacity="0.42" stroke="#22D3EE" stroke-opacity="0.3"/>
    <rect x="804" y="74" width="426" height="492" rx="20" fill="none" stroke="#A855F7" stroke-opacity="0.18"/>

    <!-- faint scattered depth dots so the panel doesn't read as empty around the cube -->
    <g fill="#94A3B8">
      <circle cx="850" cy="120" r="1.6" opacity="0.35"/>
      <circle cx="1195" cy="150" r="1.4" opacity="0.3"/>
      <circle cx="1180" cy="500" r="1.6" opacity="0.3"/>
      <circle cx="830" cy="520" r="1.4" opacity="0.32"/>
      <circle cx="1210" cy="330" r="1.4" opacity="0.28"/>
      <circle cx="825" cy="330" r="1.4" opacity="0.28"/>
    </g>

    <!-- slow orbit ring around the cube -->
    <g transform="translate(1017 328)">
      <circle r="205" fill="none" stroke="#A855F7" stroke-opacity="0.2" stroke-width="1.1" stroke-dasharray="2 11">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="40s" repeatCount="indefinite"/>
      </circle>
      <circle r="176" fill="none" stroke="#22D3EE" stroke-opacity="0.12" stroke-width="1"/>
    </g>

    <!-- cube faces -->
    <g filter="url(#glowSoft)">
      <!-- top -->
      <polygon points="1017,140 1155,220 1017,300 879,220" fill="url(#gradCubeTop)" fill-opacity="0.92"/>
      <line x1="948" y1="180" x2="1086" y2="260" stroke="#09090B" stroke-opacity="0.35" stroke-width="1.8"/>
      <line x1="1086" y1="180" x2="948" y2="260" stroke="#09090B" stroke-opacity="0.35" stroke-width="1.8"/>

      <!-- left (shadow side) -->
      <polygon points="879,220 1017,300 1017,517 879,437" fill="url(#gradCubeLeft)" fill-opacity="0.85"/>
      <line x1="948" y1="260" x2="948" y2="477" stroke="#09090B" stroke-opacity="0.4" stroke-width="1.8"/>
      <line x1="879" y1="328.5" x2="1017" y2="408.5" stroke="#09090B" stroke-opacity="0.4" stroke-width="1.8"/>

      <!-- right (lit side) -->
      <polygon points="1017,300 1155,220 1155,437 1017,517" fill="url(#gradCubeRight)" fill-opacity="0.78"/>
      <line x1="1086" y1="260" x2="1086" y2="477" stroke="#09090B" stroke-opacity="0.3" stroke-width="1.8"/>
      <line x1="1017" y1="408.5" x2="1155" y2="328.5" stroke="#09090B" stroke-opacity="0.3" stroke-width="1.8"/>
    </g>

    <!-- pulsing hub where all three faces meet: the shared cube-state vertex -->
    <circle cx="1017" cy="300" r="6" fill="#F8FAFC" filter="url(#glowStrong)">
      <animate attributeName="r" values="5;8.5;5" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>

    <text x="1017" y="547" font-family="'JetBrains Mono','IBM Plex Mono','Fira Code',monospace" font-size="13" letter-spacing="2" fill="#94A3B8" text-anchor="middle" opacity="0.6">2×2 · CUBE-STATE ENGINE</text>

    <!-- small quiet nods to the other two roles -->
    <g font-family="'JetBrains Mono','IBM Plex Mono','Fira Code',monospace" opacity="0.4">
      <text x="822" y="106" font-size="20" fill="#22D3EE">&lt;/&gt;</text>
      <g transform="translate(1188 96)" stroke="#EC4899" stroke-width="1.6" fill="none">
        <rect x="-9" y="-2" width="18" height="14" rx="2"/>
        <path d="M-5 -2 V-7 A5 5 0 0 1 5 -7 V-2"/>
      </g>
    </g>
  </g>

  <!-- global scanline -->
  <rect x="0" y="-120" width="1280" height="120" fill="url(#gradScanline)" opacity="0.28">
    <animate attributeName="y" values="-120;640" dur="11s" repeatCount="indefinite"/>
  </rect>

  <!-- noise overlay -->
  <rect width="1280" height="640" filter="url(#noiseFX)" opacity="0.3"/>

  <!-- border shimmer -->
  <rect x="8" y="8" width="1264" height="624" rx="18" fill="none" stroke="url(#gradBorderShimmer)" stroke-width="2" filter="url(#glowSoft)"/>
</svg>
